<!DOCTYPE html>
<html>
<head>
  <title>Customer Laundry Status</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  
  <style>
    body {
      font-size: 15px; 
      line-height: 1.3; 
    }
    
    h3 {
      font-size: 1.9rem;
      margin-bottom: 1.2rem;
    }
    
    .card {
      padding: 2rem !important; 
    }
    
    #content p {
      font-size: 1.2rem; 
      margin-bottom: 1rem;
    }

    .section-title {
      font-size: 1.3rem;
      font-weight: bold;
      color: #0056b3;
      border-bottom: 2px solid #e0e0e0;
      padding-bottom: 5px;
      margin-top: 25px;
      margin-bottom: 15px;
    }

    .service-subheader {
      font-size: 1.15rem;
      font-weight: 700;
      color: #0d6efd;
      background-color: #e7f1ff;
      padding: 6px 12px;
      border-radius: 6px;
      margin-top: 12px;
      margin-bottom: 8px;
      display: inline-block;
    }

    .description-box {
      background-color: #f8f9fa;
      padding: 15px;
      border-radius: 8px;
      border-left: 4px solid #007bff;
      line-height: 1.8;
      font-size: 1.3rem;
    }

    .item-line {
      margin-bottom: 8px;
      padding-left: 10px;
    }

    .item-price {
      font-size: 1.1rem;
      font-weight: bold;
      color: #28a745;
      margin-left: 15px;
      display: block;
    }
    
    .overdue-warning {
      color: #dc3545;
      font-weight: bold;
      font-size: 1.3rem;
    }

    .payment-list li {
      margin-bottom: 8px;
      font-size: 1.1rem;
    }

    /* Download Banner Animation */
    #downloadBanner {
      transition: opacity 1.5s ease-out;
      opacity: 1;
    }
    #downloadBanner.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    /* Printable/Downloadable Receipt Styling */
    #receiptPrintArea {
      background: #ffffff;
      padding: 10px;
    }
    .receipt-header {
      text-align: center;
      margin-bottom: 20px;
      border-bottom: 2px dashed #007bff;
      padding-bottom: 15px;
    }
    .receipt-header img {
      max-height: 70px;
      margin-bottom: 10px;
    }

    /* Compact styles applied ONLY during PDF generation */
    .pdf-compact {
      padding: 1rem !important;
    }
    .pdf-compact h3 {
      font-size: 1.3rem !important;
      margin-bottom: 0.6rem !important;
    }
    .pdf-compact .receipt-header {
      margin-bottom: 10px !important;
      padding-bottom: 8px !important;
    }
    .pdf-compact .receipt-header h2 {
      font-size: 1.4rem !important;
    }
    .pdf-compact .section-title {
      font-size: 1rem !important;
      margin-top: 10px !important;
      margin-bottom: 6px !important;
      padding-bottom: 2px !important;
    }
    .pdf-compact .service-subheader {
      font-size: 0.95rem !important;
      padding: 4px 8px !important;
      margin-top: 8px !important;
      margin-bottom: 6px !important;
    }
    .pdf-compact #content p {
      font-size: 0.9rem !important;
      margin-bottom: 0.3rem !important;
    }
    .pdf-compact .description-box {
      padding: 8px !important;
      font-size: 0.9rem !important;
      line-height: 1.3 !important;
    }
    .pdf-compact .item-line {
      margin-bottom: 4px !important;
    }
    .pdf-compact .item-price {
      font-size: 0.85rem !important;
    }
    .pdf-compact .payment-list li {
      font-size: 0.85rem !important;
      margin-bottom: 3px !important;
    }
  </style>
</head>

<body class="bg-light">

<div class="container mt-4 mb-5">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <button class="btn btn-success fw-bold px-3 py-2" id="downloadPdfBtn" onclick="downloadReceipt()">
      📥 Download Receipt (PDF)
    </button>
  </div>

  <div id="downloadBanner" class="alert alert-warning text-center fw-bold fs-5 shadow-sm" role="alert">
    ⚠️ PLEASE IT IS ADVISED YOU DOWNLOAD THIS RECEIPT. CHECK THE BUTTON AT THE TOP!
  </div>

  <div class="card p-3 shadow" id="receiptPrintArea">
    <div class="receipt-header">
      <img src="pastorpal-img.jpeg" alt="PASTOR PAL Logo" onerror="this.style.display='none'">
      <h2 class="fw-bold text-primary mb-1">PASTOR PAL LAUNDRY</h2>
      <p class="text-muted mb-0">Quality & Professional Laundry Services</p>
    </div>

    <h3 class="text-center">🧺 Laundry Receipt & Status</h3>
    <div id="content">Loading...</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>
setTimeout(() => {
  const banner = document.getElementById("downloadBanner");
  if (banner) {
    banner.classList.add("fade-out");
    setTimeout(() => banner.style.display = "none", 1500);
  }
}, 7000);

function safeParseJSON(value, fallback = []) {
  if (Array.isArray(value)) return value;
  if (!value) return fallback;
  try {
    const parsed = typeof value === "string" ? JSON.parse(value) : value;
    return Array.isArray(parsed) ? parsed : fallback;
  } catch { return fallback; }
}

const supabaseClient = window.supabase.createClient(
  "https://rpcczulnkogylqjzlikq.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJwY2N6dWxua29neWxxanpsaWtxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA0MzM2NTUsImV4cCI6MjA3NjAwOTY1NX0.jTbunk_ErVYXEXriO6hWUhcV0MQrlnhkVRoJQHduLRA"
);

const urlParams = new URLSearchParams(window.location.search);
const id = urlParams.get("id");
let customerNameForPdf = "Laundry_Receipt";

async function loadCustomer() {
  if (!id) {
    document.getElementById("content").innerHTML = "<p class='text-danger'>Invalid link.</p>";
    return;
  }

  const { data, error } = await supabaseClient
    .from("customers")
    .select("*")
    .eq("id", id)
    .single();

  if (error || !data) {
    document.getElementById("content").innerHTML = "<p class='text-danger'>Customer not found.</p>";
    return;
  }

  customerNameForPdf = data.name ? data.name.replace(/\s+/g, '_') : "Customer";

  const dateBrought = data.date ? new Date(data.date).toLocaleDateString('en-NG', { 
    year: 'numeric', month: 'long', day: 'numeric' 
  }) : "Not recorded";

  // Parse Multi-Service Categories or regular lines
  let formattedDesc = "None";
  if (data.description) {
    const lines = data.description.split(/\n/);
    formattedDesc = lines.map(line => {
      const cleanLine = line.trim();
      if (!cleanLine) return '';

      // Detect service sub-headers (e.g. "WASH & IRON:", "[Ironing Only]", or ending with colon)
      if (cleanLine.endsWith(':') || /^\[.*\]$/.test(cleanLine) || cleanLine.toLowerCase().startsWith('service:')) {
        const headerTitle = cleanLine.replace(/^\[|\]$|:/g, '').trim();
        return `<div class="service-subheader">🧺 Service: ${headerTitle.toUpperCase()}</div>`;
      }

      // Handle item lines with optional prices
      const priceMatch = cleanLine.match(/\b\d{3,}\b/);
      if (priceMatch) {
        const extractedPrice = Number(priceMatch[0]).toLocaleString();
        const nameWithoutPrice = cleanLine.replace(/\b\d{3,}\b/, '').trim();
        return `
          <div class="item-line">
            • ${nameWithoutPrice}
            <span class="item-price">Price: ₦${extractedPrice}</span>
          </div>`;
      } else {
        return `<div class="item-line">• ${cleanLine}</div>`;
      }
    }).join('');
  }

  let isOverdue = false;
  if (data.agreedDate && data.status === "Pending") {
    isOverdue = new Date(data.agreedDate) < new Date();
  }

  const payments = safeParseJSON(data.payments, []);
  const totalPaid = payments.reduce((sum, p) => sum + (Number(p.amount) || 0), 0);
  const totalAmount = Number(data.totalAmount) || 0;
  const balance = Math.max(totalAmount - totalPaid, 0);
  
  let paymentsHtml = "<li>No payments recorded yet</li>";
  if (payments.length > 0) {
    paymentsHtml = payments.map(p => {
      const pDate = new Date(p.date).toLocaleDateString('en-NG', { year: 'numeric', month: 'short', day: 'numeric' });
      return `<li>₦${p.amount.toLocaleString()} via <b>${p.method}</b> on ${pDate}</li>`;
    }).join('');
  }

  document.getElementById("content").innerHTML = `
    <div class="section-title">Customer Information</div>
    <p><b>Name:</b> ${data.name}</p>
    <p><b>Phone:</b> ${data.phone}</p>
    <p>
      <b>Status:</b> 
      <span style="color: ${data.status === 'Collected' ? 'green' : '#ffc107'}; font-weight: bold; font-size: 1.3rem;">
        ${data.status}
      </span>
    </p>
    ${isOverdue ? '<p class="overdue-warning">⚠️ Overdue for pickup!</p>' : ''}

    <div class="section-title">Important Dates</div>
    <p><b>Date Brought:</b> ${dateBrought}</p>
    <p><b>Agreed Pick-up Date:</b> ${data.agreedDate || "Not set"}</p>
    ${data.status === 'Collected' ? `<p><b>Actual Pickup Date:</b> ${data.pickupDate || "Not set"}</p>` : ''}

    <div class="section-title">Clothes & Service Details</div>
    <p><b>General Notes:</b> ${data.instruction || "None"}</p>
    <p><b>Total Clothes Dropped:</b> ${data.totalItems ?? 0}</p>
    <p><b>Remaining Clothes:</b> ${data.remaining ?? 0}</p>
    
    <p><b>Breakdown:</b></p>
    <div class="description-box">
      ${formattedDesc}
    </div>

    <div class="section-title">Payment Information</div>
    <p><b>Total Amount:</b> ₦${totalAmount.toLocaleString()}</p>
    <p><b>Total Paid:</b> <span style="color: green; font-weight: bold;">₦${totalPaid.toLocaleString()}</span></p>
    <p><b>Balance Remaining:</b> <span style="color: ${balance > 0 ? 'red' : 'green'}; font-weight: bold; font-size: 1.3rem;">₦${balance.toLocaleString()}</span></p>

    <ul class="payment-list mt-3" style="list-style-type: none; padding: 0;">
      <li><b>Payment History:</b></li>
      ${paymentsHtml}
    </ul>
  `;
}

function downloadReceipt() {
  const element = document.getElementById('receiptPrintArea');
  element.classList.add('pdf-compact');

  const opt = {
    margin:       [0.2, 0.2, 0.2, 0.2],
    filename:     `PastorPal_Receipt_${customerNameForPdf}.pdf`,
    image:        { type: 'jpeg', quality: 0.98 },
    html2canvas:  { scale: 2, useCORS: true },
    jsPDF:        { unit: 'in', format: 'a4', orientation: 'portrait' },
    pagebreak:    { mode: ['avoid-all', 'css', 'legacy'] }
  };

  html2pdf().set(opt).from(element).save().then(() => {
    element.classList.remove('pdf-compact');
  });
}

loadCustomer();
</script>

</body>
</html>
